name: Build OpenWrt 23.05.5 for Archer C60 v2 (16MB)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget

      - name: Clone OpenWrt v23.05.5
        run: |
          REPO_URL="https://github.com""/openwrt/openwrt.git"
          git clone --depth 1 --branch v23.05.5 "$REPO_URL" openwrt

      - name: Patch Archer C60 v2 for 16MB Flash
        working-directory: openwrt
        run: |
          sed -i '/define Device\/tplink_archer-c60-v2/,/endef/ s/IMAGE_SIZE := .*/IMAGE_SIZE := 16064k/' target/linux/ath79/image/generic-tp-link.mk

          for f in target/linux/ath79/dts/*archer-c60*; do
            sed -i 's/reg = <0x020000 0x7[a-f0-9]\+>;/reg = <0x020000 0xfb0000>;/g' "$f"
            sed -i 's/partition@7d0000 {/partition@fd0000 {/g' "$f"
            sed -i 's/reg = <0x7d0000 0x020000>;/reg = <0xfd0000 0x020000>;/g' "$f"
            sed -i 's/partition@7f0000 {/partition@ff0000 {/g' "$f"
            sed -i 's/reg = <0x7f0000 0x010000>;/reg = <0xff0000 0x010000>;/g' "$f"
          done

          printf '\ndefine Host/PatchArcherC60V2\n\t$(SED) '\''s/{"file-system", 0x1c0000, 0x610000}/{"file-system", 0x1c0000, 0xe10000}/g'\'' $(HOST_BUILD_DIR)/src/tplink-safeloader.c\n\t$(SED) '\''s/0x7d0000,/0xfd0000,/g; s/0x7d0200,/0xfd0200,/g; s/0x7d0400,/0xfd0400,/g; s/0x7d0800,/0xfd0800,/g; s/0x7d1000,/0xfd1000,/g; s/0x7d2000,/0xfd2000,/g; s/0x7d3000,/0xfd3000,/g; s/0x7d4000,/0xfd4000,/g; s/0x7d7000,/0xfd7000,/g; s/0x7db000,/0xfdb000,/g; s/0x7df000,/0xfdf000,/g; s/0x7e8000,/0xfe8000,/g; s/0x7f0000,/0xff0000,/g'\'' $(HOST_BUILD_DIR)/src/tplink-safeloader.c\nendef\nHooks/HostPrepare/Post += Host/PatchArcherC60V2\n' >> tools/firmware-utils/Makefile

          grep -A 5 "define Device/tplink_archer-c60-v2" target/linux/ath79/image/generic-tp-link.mk
          grep -n "0xfb0000\|0xfd0000\|0xff0000" target/linux/ath79/dts/*archer-c60*
          tail -n 6 tools/firmware-utils/Makefile

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply seed.config
        run: |
          cp seed.config openwrt/.config
          cd openwrt
          make defconfig

      - name: Download sources
        working-directory: openwrt
        run: make download -j$(nproc)

      - name: Compile OpenWrt
        working-directory: openwrt
        run: make -j$(nproc) || make -j1 V=s

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-archer-c60-v2-16mb
          path: openwrt/bin/targets/ath79/generic/*tplink_archer-c60-v2*


