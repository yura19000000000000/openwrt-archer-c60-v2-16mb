name: Build OpenWrt 23.05.5 for Archer C60 v2 (16MB)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget

      - name: Clone OpenWrt v23.05.5
        run: |
          REPO_URL="https://github.com""/openwrt/openwrt.git"
          git clone --depth 1 --branch v23.05.5 "$REPO_URL" openwrt

      - name: Patch Archer C60 v2 for 16MB Flash (DTS and Makefile)
        working-directory: openwrt
        run: |
          python3 - << 'EOF'
          import glob, os, re

          # 1. Правка Makefile (generic-tp-link.mk)
          mk_path = "target/linux/ath79/image/generic-tp-link.mk"
          with open(mk_path, "r") as f:
              mk = f.read()
          mk_new = re.sub(
              r'(define Device/tplink_archer-c60-v2.*?IMAGE_SIZE := )\d+k',
              r'\g<1>16064k',
              mk,
              flags=re.S
          )
          assert mk != mk_new, "Не удалось обновить IMAGE_SIZE в generic-tp-link.mk"
          with open(mk_path, "w") as f:
              f.write(mk_new)
          print("OK: generic-tp-link.mk patched")

          # 2. Автопоиск и правка нужного DTS/DTSI файла для Archer C60 v2
          dts_patched = False
          for path in glob.glob("target/linux/ath79/dts/*archer-c60*"):
              with open(path, "r") as f:
                  data = f.read()
              if "0x7d0000" in data and "0x7f0000" in data:
                  data = re.sub(r'reg = <0x020000 0x7[a-f0-9]+>;', 'reg = <0x020000 0xfb0000>;', data)
                  data = data.replace("partition@7d0000 {", "partition@fd0000 {")
                  data = data.replace("reg = <0x7d0000 0x020000>;", "reg = <0xfd0000 0x020000>;")
                  data = data.replace("partition@7f0000 {", "partition@ff0000 {")
                  data = data.replace("reg = <0x7f0000 0x010000>;", "reg = <0xff0000 0x010000>;")
                  with open(path, "w") as f:
                      f.write(data)
                  print(f"OK: {path} patched")
                  dts_patched = True
          assert dts_patched, "Не найден DTS файл с разметкой 0x7d0000 / 0x7f0000"
          EOF

          # 3. Создаем патч для утилиты tplink-safeloader.c под 16 МБ
          mkdir -p tools/firmware-utils/patches
          cat << 'EOF' > tools/firmware-utils/patches/999-archer-c60-v2-16mb.patch
          --- a/src/tplink-safeloader.c
          +++ b/src/tplink-safeloader.c
          @@ -1747,19 +1747,19 @@ static struct device_info boards[] = {
           		.partitions = {
           			{"fs-uboot", 0x00000, 0x10000},
           			{"mac", 0x10000, 0x10000},
          -			{"os-image", 0x20000, 0x1a0000},
          -			{"file-system", 0x1c0000, 0x610000},
          -			{"default-mac", 0x7d0000, 0x00200},
          -			{"pin", 0x7d0200, 0x00200},
          -			{"device-id", 0x7d0400, 0x00400},
          -			{"product-info", 0x7d0800, 0x00800},
          -			{"partition-table", 0x7d1000, 0x01000},
          -			{"soft-version", 0x7d2000, 0x01000},
          -			{"support-list", 0x7d3000, 0x01000},
          -			{"profile", 0x7d4000, 0x03000},
          -			{"default-config", 0x7d7000, 0x04000},
          -			{"user-config", 0x7db000, 0x04000},
          -			{"extra-para", 0x7df000, 0x01000},
          -			{"certyficate", 0x7e8000, 0x08000},
          -			{"radio", 0x7f0000, 0x10000},
          +			{"os-image", 0x20000, 0x1a0000},
          +			{"file-system", 0x1c0000, 0xe10000},
          +			{"default-mac", 0xfd0000, 0x00200},
          +			{"pin", 0xfd0200, 0x00200},
          +			{"device-id", 0xfd0400, 0x00400},
          +			{"product-info", 0xfd0800, 0x00800},
          +			{"partition-table", 0xfd1000, 0x01000},
          +			{"soft-version", 0xfd2000, 0x01000},
          +			{"support-list", 0xfd3000, 0x01000},
          +			{"profile", 0xfd4000, 0x03000},
          +			{"default-config", 0xfd7000, 0x04000},
          +			{"user-config", 0xfdb000, 0x04000},
          +			{"extra-para", 0xfdf000, 0x01000},
          +			{"certyficate", 0xfe8000, 0x08000},
          +			{"radio", 0xff0000, 0x10000},
           			{NULL, 0, 0}
           		},
          EOF


      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply seed.config
        run: |
          cp seed.config openwrt/.config
          cd openwrt
          make defconfig

      - name: Download sources
        working-directory: openwrt
        run: make download -j$(nproc)

      - name: Compile OpenWrt
        working-directory: openwrt
        run: make -j$(nproc) || make -j1 V=s

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-archer-c60-v2-16mb
          path: openwrt/bin/targets/ath79/generic/*tplink_archer-c60-v2*
